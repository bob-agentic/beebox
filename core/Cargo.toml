[package]
name = "beebox-core"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs"] }
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
serde_json = "1.0.151"
futures-util = "0.3.34"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
mime_guess = "2.0.5"
sha2 = "0.10"
if-addrs = "0.15"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
